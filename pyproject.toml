[project]
name = "secure-test-ops"
version = "0.1.0"
description = "AI-aware security testing automation framework using pytest, Playwright and OWASP ZAP."
requires-python = ">=3.11"
dependencies = [
    "pytest==8.4.2",
    "pytest-html==4.1.1",
    "requests==2.32.5",
    "python-dotenv==1.1.1",
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "playwright==1.55.0",
    "pytest-playwright==0.7.0",
    "tenacity==9.1.2",
]

[tool.pytest.ini_options]
testpaths = [
    "api_tests",
    "ui_tests",
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-v",
    "--html=reports/report.html",
    "--self-contained-html",
]

markers = [
    "api: API tests",
    "ui: browser/UI tests",
    "security: security-focused tests",
    "smoke: smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true