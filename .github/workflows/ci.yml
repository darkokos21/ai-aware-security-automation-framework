name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Run Security Automation Framework
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # Playwright
      # ---------------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # ---------------------------------------------------------
      # Start Juice Shop
      # ---------------------------------------------------------
      - name: Start Juice Shop
        run: |
          docker compose -f docker/docker-compose.yml up -d juice-shop

      - name: Wait for Juice Shop
        run: |
          timeout=120
          elapsed=0

          until curl -fs http://localhost:31001 > /dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Juice Shop failed to start."
              docker compose -f docker/docker-compose.yml logs juice-shop
              exit 1
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "Juice Shop is ready."

      # ---------------------------------------------------------
      # API Security Tests
      # Expected findings should not fail CI.
      # ---------------------------------------------------------
      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests -v \
            --html=reports/api-report.html \
            --self-contained-html

      # ---------------------------------------------------------
      # UI Security Tests
      # ---------------------------------------------------------
      - name: Run UI security tests
        continue-on-error: true
        run: |
          pytest ui_tests -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ---------------------------------------------------------
      # OWASP ZAP Baseline Scan
      # ---------------------------------------------------------
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          mkdir -p reports

          echo "Running OWASP ZAP Baseline Scan..."

          docker run --rm \
            --network docker_security-testing \
            -v "$PWD/reports:/zap/wrk:rw" \
            zaproxy/zap-stable:2.16.0 \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -r zap-report.html \
              -I || true

          echo "Generating JSON report from ZAP API..."

          docker run --rm \
            --network host \
            zaproxy/zap-stable:2.16.0 \
            sh -c "curl -fsS http://127.0.0.1:31002/JSON/core/view/alerts/ > /tmp/zap.json && cat /tmp/zap.json" \
            > reports/zap-report.json || echo '{"alerts":[]}' > reports/zap-report.json

          echo "Reports directory after scan:"
          ls -la reports

      # ---------------------------------------------------------
      # Verify ZAP Reports
      # ---------------------------------------------------------
      - name: Verify ZAP Reports
        run: |
          echo "Checking generated ZAP reports..."
          ls -la reports

          if [ ! -f reports/zap-report.html ]; then
            echo "❌ Missing reports/zap-report.html"
            exit 1
          fi

          if [ ! -f reports/zap-report.json ]; then
            echo "❌ Missing reports/zap-report.json"
            exit 1
          fi

          echo "✅ ZAP reports generated successfully:"
          ls -lh reports/zap-report.*

      # ---------------------------------------------------------
      # AI Pipeline Tests (must pass)
      # ---------------------------------------------------------
      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      # ---------------------------------------------------------
      # Upload Artifacts
      # ---------------------------------------------------------
      - name: Upload HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-test-reports
          path: |
            reports/api-report.html
            reports/ui-report.html
            reports/zap-report.html
          if-no-files-found: warn

      - name: Upload Security JSON Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-json-reports
          path: |
            reports/api-security-findings.json
            reports/ui-security-findings.json
            reports/zap-report.json
          if-no-files-found: warn

      - name: Upload Docker Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: reports/
          if-no-files-found: warn