name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Run Security Automation Framework
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # ------------------------------------------------------------
      # Start application and ZAP
      # ------------------------------------------------------------
      - name: Start Juice Shop and ZAP
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            up -d juice-shop zap

      - name: Wait for Juice Shop
        run: |
          timeout_seconds=120
          interval_seconds=5
          elapsed=0

          while [ "$elapsed" -lt "$timeout_seconds" ]; do
            if curl -fsS http://127.0.0.1:31001 > /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi

            echo "Waiting for Juice Shop... ${elapsed}/${timeout_seconds}s"
            sleep "$interval_seconds"
            elapsed=$((elapsed + interval_seconds))
          done

          echo "Juice Shop failed to start."
          docker compose -f docker/docker-compose.yml logs juice-shop
          exit 1

      - name: Wait for ZAP API
        run: |
          timeout_seconds=180
          interval_seconds=5
          elapsed=0

          while [ "$elapsed" -lt "$timeout_seconds" ]; do
            echo "Checking ZAP API... ${elapsed}/${timeout_seconds}s"

            response="$(curl -sS \
              --connect-timeout 5 \
              --max-time 10 \
              -w '\nHTTP_STATUS:%{http_code}' \
              "http://127.0.0.1:31002/JSON/core/view/version/?apikey=secure-test-ops" \
              || true)"

            body="$(printf '%s\n' "$response" | sed '/HTTP_STATUS:/d')"
            status="$(printf '%s\n' "$response" | awk -F: '/HTTP_STATUS:/ {print $2}')"

            if [ "$status" = "200" ] && \
              printf '%s\n' "$body" | python -m json.tool > /dev/null 2>&1; then
              echo "ZAP API is ready."
              printf '%s\n' "$body"
              exit 0
            fi

            if [ $((elapsed % 30)) -eq 0 ]; then
              echo "Current HTTP status: ${status:-none}"
              docker compose \
                -f docker/docker-compose.yml \
                ps zap

              docker compose \
                -f docker/docker-compose.yml \
                logs --tail=30 zap
            fi

            sleep "$interval_seconds"
            elapsed=$((elapsed + interval_seconds))
          done

          echo "ZAP API never became ready."

          docker compose \
            -f docker/docker-compose.yml \
            ps

          docker compose \
            -f docker/docker-compose.yml \
            logs --tail=300 zap

          exit 1

      # ------------------------------------------------------------
      # Run ZAP passive scan
      # ------------------------------------------------------------
      - name: Run ZAP baseline scan
        run: |
          mkdir -p reports

          docker run --rm \
            --network docker_security-testing \
            -v "$(pwd)/reports:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -J zap-report.json \
              -r zap-report.html \
              -I

      - name: Verify ZAP report
        run: |
          echo "Checking for ZAP JSON report..."

          if [ ! -f reports/zap-report.json ]; then
            echo "ZAP report was not generated."
            ls -la reports
            exit 1
          fi

          echo "ZAP report generated successfully."
          ls -lh reports/zap-report.json

      # ------------------------------------------------------------
      # Security test suites (findings are expected)
      # ------------------------------------------------------------
      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests -v \
            --html=reports/api-report.html \
            --self-contained-html

      - name: Run UI security tests
        continue-on-error: true
        run: |
          pytest ui_tests -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # AI pipeline (must pass)
      # ------------------------------------------------------------
      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------
      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-reports
          path: |
            reports/report.html
            reports/api-report.html
            reports/ui-report.html
            reports/zap-report.html
          if-no-files-found: warn

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/*.json
            reports/*.md
          if-no-files-found: warn

      - name: Upload Docker logs on failure
        if: failure()
        run: |
          mkdir -p reports/docker-logs

          docker compose \
            -f docker/docker-compose.yml \
            logs juice-shop > reports/docker-logs/juice-shop.log || true

          docker compose \
            -f docker/docker-compose.yml \
            logs zap > reports/docker-logs/zap.log || true

      - name: Upload Docker logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: reports/docker-logs
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------
      - name: Stop containers
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            down -v