name: AI-Aware Security Automation Framework CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  workflow_dispatch:

jobs:
  security-framework:
    name: Security Automation Framework
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # -----------------------------
      # Start vulnerable application
      # -----------------------------
      - name: Start Juice Shop
        run: |
          docker compose -f docker/docker-compose.yml up -d juice-shop

      - name: Wait for Juice Shop
        run: |
          timeout=120

          until curl -fs http://127.0.0.1:31001 >/dev/null; do
            timeout=$((timeout-5))

            if [ "$timeout" -le 0 ]; then
              echo "Juice Shop failed to start."
              docker compose -f docker/docker-compose.yml logs juice-shop
              exit 1
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
          done

          echo "Juice Shop is ready."

      # -----------------------------
      # Run ZAP Baseline Scan
      # -----------------------------
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          mkdir -p reports
          chmod -R 777 reports

          set +e

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network docker_security-testing \
            -v "$GITHUB_WORKSPACE/reports:/zap/wrk:rw" \
            zaproxy/zap-stable:2.16.0 \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -J /zap/wrk/zap-report.json \
              -r /zap/wrk/zap-report.html \
              -I

          ZAP_EXIT_CODE=$?

          set -e

          echo "ZAP exited with code: $ZAP_EXIT_CODE"
          echo "Reports directory contents:"
          ls -la reports

      # -----------------------------
      # Verify ZAP reports exist
      # -----------------------------
      - name: Verify ZAP Reports
        run: |
          echo "Checking generated ZAP reports..."

          ls -la reports

          test -f reports/zap-report.json
          test -f reports/zap-report.html

          echo "ZAP reports generated successfully:"
          ls -lh reports/zap-report.*

      # -----------------------------
      # API security tests
      # -----------------------------
      - name: Run API Security Tests
        continue-on-error: true
        run: |
          pytest api_tests -v \
            --html=reports/api-report.html \
            --self-contained-html

      # -----------------------------
      # UI security tests
      # -----------------------------
      - name: Run UI Security Tests
        continue-on-error: true
        run: |
          pytest ui_tests -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # -----------------------------
      # AI correlation / reporting tests
      # -----------------------------
      - name: Run AI Pipeline Tests
        run: pytest tests -v

      # -----------------------------
      # Upload reports
      # -----------------------------
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

      - name: Upload Docker Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            docker/docker-compose.yml