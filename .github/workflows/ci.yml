name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Security Automation Pipeline
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # Playwright
      # ------------------------------------------------------------
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # ------------------------------------------------------------
      # Prepare reports directory
      # ------------------------------------------------------------
      - name: Prepare reports directory
        run: |
          mkdir -p reports
          chmod -R 777 reports

      # ------------------------------------------------------------
      # Start Juice Shop + ZAP
      # ------------------------------------------------------------
      - name: Start Docker services
        run: |
          docker compose -f docker/docker-compose.yml up -d juice-shop zap

      # ------------------------------------------------------------
      # Wait for Juice Shop
      # ------------------------------------------------------------
      - name: Wait for Juice Shop
        run: |
          timeout=120
          elapsed=0

          until curl -fs http://localhost:31001 > /dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Juice Shop failed to start."
              docker compose -f docker/docker-compose.yml logs juice-shop
              exit 1
            fi

            sleep 5
            elapsed=$((elapsed+5))
          done

          echo "Juice Shop is ready."

      # ------------------------------------------------------------
      # Wait for ZAP API
      # ------------------------------------------------------------
      - name: Wait for ZAP API
        run: |
          timeout=180
          elapsed=0

          until curl -s "http://localhost:31002/JSON/core/view/version/?apikey=secure-test-ops" \
            | grep version > /dev/null; do

            if [ "$elapsed" -ge "$timeout" ]; then
              echo "ZAP failed to start."
              docker compose -f docker/docker-compose.yml logs zap
              exit 1
            fi

            echo "Waiting for ZAP... ${elapsed}s"
            sleep 5
            elapsed=$((elapsed+5))
          done

          echo "ZAP API is ready."

      # ------------------------------------------------------------
      # ZAP Baseline Scan
      # ------------------------------------------------------------
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm \
            --user root \
            --network docker_security-testing \
            -v "$PWD/reports:/zap/wrk:rw" \
            zaproxy/zap-stable:2.16.0 \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -J /zap/wrk/zap-report.json \
              -I

          echo "Reports after scan:"
          ls -la reports

      # ------------------------------------------------------------
      # Verify only JSON report (AI pipeline input)
      # ------------------------------------------------------------
      - name: Verify ZAP JSON Report
        run: |
          echo "Checking generated reports..."
          ls -la reports

          if [ ! -s reports/zap-report.json ]; then
            echo "Missing or empty reports/zap-report.json"
            exit 1
          fi

          echo "ZAP JSON report exists."
          head reports/zap-report.json

      # ------------------------------------------------------------
      # API Security Tests
      # ------------------------------------------------------------
      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests \
            -v \
            --html=reports/api-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # UI Security Tests
      # ------------------------------------------------------------
      - name: Run UI security tests
        continue-on-error: true
        run: |
          pytest ui_tests \
            -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # AI Pipeline Tests (must pass)
      # ------------------------------------------------------------
      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      # ------------------------------------------------------------
      # Upload Reports
      # ------------------------------------------------------------
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      # ------------------------------------------------------------
      # Upload Docker logs if CI fails
      # ------------------------------------------------------------
      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            reports/