name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Run Security Automation Framework
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Start Juice Shop and ZAP
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            up -d juice-shop zap

          echo "Docker Compose status:"
          docker compose \
            -f docker/docker-compose.yml \
            ps

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do
            if curl -fsS \
              --connect-timeout 5 \
              --max-time 10 \
              http://127.0.0.1:31001 \
              > /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi

            echo "Waiting for Juice Shop... attempt ${i}/30"
            sleep 5
          done

          echo "Juice Shop failed to start."

          docker compose \
            -f docker/docker-compose.yml \
            ps

          docker compose \
            -f docker/docker-compose.yml \
            logs --tail=200 juice-shop

          exit 1

      - name: Wait for ZAP
        run: |
          timeout_seconds=900
          interval_seconds=5
          elapsed=0

          while [ "$elapsed" -lt "$timeout_seconds" ]; do
            echo "Checking ZAP... ${elapsed}/${timeout_seconds}s"

            response="$(curl -sS \
              --connect-timeout 5 \
              --max-time 10 \
              -w '\nHTTP_STATUS:%{http_code}' \
              "http://127.0.0.1:31002/JSON/core/view/version/?apikey=secure-test-ops" \
              || true)"

            body="$(printf '%s\n' "$response" | sed '/HTTP_STATUS:/d')"
            status="$(printf '%s\n' "$response" | awk -F: '/HTTP_STATUS:/ {print $2}')"

            if [ "$status" = "200" ] &&
              printf '%s\n' "$body" | python -m json.tool > /dev/null 2>&1; then
              echo "ZAP is ready."
              echo "ZAP API response:"
              printf '%s\n' "$body"
              exit 0
            fi

            if [ $((elapsed % 25)) -eq 0 ]; then
              echo "ZAP is not ready yet. HTTP status: ${status:-unavailable}"

              echo "ZAP container status:"
              docker compose \
                -f docker/docker-compose.yml \
                ps zap

              echo "Recent ZAP logs:"
              docker compose \
                -f docker/docker-compose.yml \
                logs --tail=50 zap
            fi

            sleep "$interval_seconds"
            elapsed=$((elapsed + interval_seconds))
          done

          echo "ZAP failed to become ready."

          echo "Final Docker Compose status:"
          docker compose \
            -f docker/docker-compose.yml \
            ps

          echo "Final ZAP logs:"
          docker compose \
            -f docker/docker-compose.yml \
            logs --tail=300 zap

          exit 1

      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests -v --html=reports/api-report.html

      - name: Run UI security tests
        continue-on-error: true
        run: |
          pytest ui_tests -v --html=reports/ui-report.html

      - name: Run ZAP security scan
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            run --rm secure-test-ops

      - name: Verify ZAP report
        run: |
          echo "Checking for ZAP JSON report..."

          if [ ! -f reports/zap-report.json ]; then
            echo "ZAP report was not generated."

            echo "Reports directory:"
            ls -la reports

            echo "Searching workspace for any JSON reports:"
            find . -name "*.json" -type f -print

            echo "Docker Compose status:"
            docker compose \
              -f docker/docker-compose.yml \
              ps

            echo "ZAP logs:"
            docker compose \
              -f docker/docker-compose.yml \
              logs --tail=200 zap

            exit 1
          fi

          echo "ZAP report generated successfully:"
          ls -lh reports/zap-report.json

      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      - name: Upload HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-reports
          path: |
            reports/report.html
            reports/api-report.html
            reports/ui-report.html
          if-no-files-found: warn

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/*.json
            reports/*.md
          if-no-files-found: warn

      - name: Upload Docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            docker/docker-compose.yml