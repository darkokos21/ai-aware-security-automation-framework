name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Security Automation Pipeline
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # Playwright
      # ------------------------------------------------------------
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # ------------------------------------------------------------
      # Prepare reports directory
      # ------------------------------------------------------------
      - name: Prepare reports directory
        run: |
          mkdir -p reports
          chmod -R 777 reports

      # ------------------------------------------------------------
      # Start Juice Shop + ZAP
      # ------------------------------------------------------------
      - name: Start Docker services
        run: |
          docker compose -f docker/docker-compose.yml up -d juice-shop zap

      # ------------------------------------------------------------
      # Wait for Juice Shop
      # ------------------------------------------------------------
      - name: Wait for Juice Shop
        run: |
          timeout=120
          elapsed=0

          until curl -fsS \
            --connect-timeout 5 \
            --max-time 10 \
            http://localhost:31001 > /dev/null; do

            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Juice Shop failed to start."
              docker compose -f docker/docker-compose.yml ps
              docker compose -f docker/docker-compose.yml logs --no-color juice-shop
              exit 1
            fi

            echo "Waiting for Juice Shop... ${elapsed}s"
            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "Juice Shop is ready."

      # ------------------------------------------------------------
      # Wait for ZAP API
      # ------------------------------------------------------------
      - name: Wait for ZAP API
        run: |
          timeout=180
          interval=5
          elapsed=0

          while [ "$elapsed" -lt "$timeout" ]; do
            echo "Checking ZAP API... ${elapsed}/${timeout}s"

            response="$(curl -sS \
              --connect-timeout 5 \
              --max-time 10 \
              -w '\nHTTP_STATUS:%{http_code}' \
              "http://127.0.0.1:31002/JSON/core/view/version/?apikey=secure-test-ops" \
              || true)"

            body="$(printf '%s\n' "$response" | sed '/HTTP_STATUS:/d')"
            status="$(printf '%s\n' "$response" | awk -F: '/HTTP_STATUS:/ {print $2}')"

            if [ "$status" = "200" ] &&
              printf '%s\n' "$body" | python -m json.tool > /dev/null 2>&1 &&
              printf '%s\n' "$body" | grep -q '"version"'; then

              echo "ZAP API is ready."
              echo "ZAP API response:"
              printf '%s\n' "$body"
              exit 0
            fi

            echo "ZAP API is not ready yet. HTTP status: ${status:-unavailable}"

            if [ $((elapsed % 30)) -eq 0 ]; then
              echo "ZAP container status:"
              docker compose \
                -f docker/docker-compose.yml \
                ps zap

              echo "Recent ZAP logs:"
              docker compose \
                -f docker/docker-compose.yml \
                logs --tail=40 --no-color zap
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "ZAP failed to become ready within ${timeout}s."

          echo "Final Docker Compose status:"
          docker compose \
            -f docker/docker-compose.yml \
            ps

          echo "Final ZAP logs:"
          docker compose \
            -f docker/docker-compose.yml \
            logs --tail=300 --no-color zap

          exit 1

      # ------------------------------------------------------------
      # ZAP Baseline Scan
      # ------------------------------------------------------------
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          mkdir -p reports
          chmod -R 777 reports

          docker run --rm \
            --user root \
            --network docker_security-testing \
            -v "$GITHUB_WORKSPACE/reports:/zap/wrk:rw" \
            zaproxy/zap-stable:2.16.0 \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -J /zap/wrk/zap-report.json \
              -r /zap/wrk/zap-report.html \
              -I

          echo "Reports after ZAP scan:"
          ls -lah reports

      # ------------------------------------------------------------
      # Verify ZAP Reports
      # ------------------------------------------------------------
      - name: Verify ZAP Reports
        run: |
          echo "Checking generated ZAP reports..."
          ls -la reports

          if [ ! -s reports/zap-report.json ]; then
            echo "❌ Missing or empty reports/zap-report.json"
            exit 1
          fi

          if [ ! -s reports/zap-report.html ]; then
            echo "❌ Missing or empty reports/zap-report.html"
            exit 1
          fi

          echo "✅ ZAP reports generated successfully:"
          ls -lh reports/zap-report.json reports/zap-report.html

      # ------------------------------------------------------------
      # API Security Tests
      # ------------------------------------------------------------
      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests \
            -v \
            --html=reports/api-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # UI Security Tests
      # ------------------------------------------------------------
      - name: Run UI Security Tests
        continue-on-error: true
        run: |
          pytest ui_tests \
            -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # AI Pipeline Tests (must pass)
      # ------------------------------------------------------------
      - name: Run AI Pipeline Tests
        run: |
          pytest tests -v

      # ------------------------------------------------------------
      # Upload Reports
      # ------------------------------------------------------------
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      # ------------------------------------------------------------
      # Upload Docker logs if CI fails
      # ------------------------------------------------------------
      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: reports/