name: AI-Aware Security Automation Framework CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  workflow_dispatch:

jobs:
  security-framework:
    name: Run Security Automation Framework
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # ---------------------------------------------------------
      # Start Juice Shop
      # ---------------------------------------------------------

      - name: Start Juice Shop
        run: |
          docker compose -f docker/docker-compose.yml up -d juice-shop

      - name: Wait for Juice Shop
        run: |
          timeout=120
          elapsed=0

          until curl -fs http://localhost:31001 > /dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Juice Shop failed to start."
              docker compose -f docker/docker-compose.yml logs juice-shop
              exit 1
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
            elapsed=$((elapsed+5))
          done

          echo "Juice Shop is ready."

      # ---------------------------------------------------------
      # API/UI security tests
      # (expected findings should not fail CI)
      # ---------------------------------------------------------

      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests -v \
            --html=reports/api-report.html \
            --self-contained-html

      - name: Run UI security tests
        continue-on-error: true
        run: |
          pytest ui_tests -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ---------------------------------------------------------
      # ZAP Baseline Scan (robust report generation)
      # ---------------------------------------------------------

      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          mkdir -p reports

          docker create \
            --name zap-baseline \
            --network docker_security-testing \
            zaproxy/zap-stable:2.16.0 \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -J /zap/wrk/zap-report.json \
              -r /zap/wrk/zap-report.html \
              -I

          docker start -a zap-baseline || true

          docker cp zap-baseline:/zap/wrk/zap-report.json reports/zap-report.json || true
          docker cp zap-baseline:/zap/wrk/zap-report.html reports/zap-report.html || true

          docker rm -f zap-baseline

      - name: Verify ZAP Reports
        run: |
          echo "Checking generated ZAP reports..."
          ls -la reports

          if [ ! -f reports/zap-report.json ]; then
            echo "❌ Missing reports/zap-report.json"
            exit 1
          fi

          if [ ! -f reports/zap-report.html ]; then
            echo "❌ Missing reports/zap-report.html"
            exit 1
          fi

          echo "✅ ZAP reports generated successfully:"
          ls -lh reports/zap-report.*

      # ---------------------------------------------------------
      # AI pipeline (must pass)
      # ---------------------------------------------------------

      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      # ---------------------------------------------------------
      # Upload artifacts
      # ---------------------------------------------------------

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-test-reports
          path: |
            reports/api-report.html
            reports/ui-report.html
            reports/zap-report.html
          if-no-files-found: warn

      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-json-reports
          path: |
            reports/api-security-findings.json
            reports/ui-security-findings.json
            reports/zap-report.json
          if-no-files-found: warn

      - name: Upload Docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            reports/