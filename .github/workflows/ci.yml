name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Security Automation Pipeline
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # Playwright
      # ------------------------------------------------------------
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # ------------------------------------------------------------
      # Prepare reports directory
      # ------------------------------------------------------------
      - name: Prepare reports directory
        run: |
          mkdir -p reports
          chmod -R 777 reports

      # ------------------------------------------------------------
      # Start Juice Shop + ZAP
      # ------------------------------------------------------------
      - name: Start Docker services
        run: |
          docker compose -f docker/docker-compose.yml up -d juice-shop zap

      # ------------------------------------------------------------
      # Wait for Juice Shop
      # ------------------------------------------------------------
      - name: Wait for Juice Shop
        run: |
          timeout=120
          elapsed=0

          until curl -fs http://localhost:31001 > /dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Juice Shop failed to start."
              docker compose -f docker/docker-compose.yml logs juice-shop
              exit 1
            fi

            sleep 5
            elapsed=$((elapsed+5))
          done

          echo "Juice Shop is ready."

      # ------------------------------------------------------------
      # Wait for ZAP API
      #
      # ZAP only serves API requests addressed to its own host:port.
      # The compose file therefore publishes the SAME port (31002)
      # that ZAP listens on inside the container. With a mismatched
      # mapping ZAP proxies the request to itself and returns 502.
      # ------------------------------------------------------------
      - name: Wait for ZAP API
        run: |
          timeout=120
          interval=5
          elapsed=0
          url="http://127.0.0.1:31002/JSON/core/view/version/?apikey=secure-test-ops"

          while [ "$elapsed" -lt "$timeout" ]; do
            body="$(
              curl --noproxy '*' -fsS \
                --connect-timeout 5 \
                --max-time 10 \
                "$url" 2>/dev/null || true
            )"

            if printf '%s' "$body" | grep -q '"version"'; then
              echo "ZAP API is ready after ${elapsed}s: ${body}"
              exit 0
            fi

            echo "Waiting for ZAP API... ${elapsed}/${timeout}s"
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "ZAP failed to become ready within ${timeout}s."

          echo "============================================================"
          echo "DOCKER COMPOSE STATUS"
          echo "============================================================"
          docker compose -f docker/docker-compose.yml ps

          echo "============================================================"
          echo "ZAP INSPECT"
          echo "============================================================"
          docker inspect secure-test-ops-zap \
            --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'
          docker port secure-test-ops-zap

          echo "============================================================"
          echo "ZAP API CHECK FROM INSIDE CONTAINER"
          echo "============================================================"
          docker exec secure-test-ops-zap \
            curl -sS --max-time 10 "http://127.0.0.1:31002/JSON/core/view/version/?apikey=secure-test-ops" || true
          echo

          echo "============================================================"
          echo "ZAP LOGS"
          echo "============================================================"
          docker compose -f docker/docker-compose.yml logs --tail=200 --no-color zap

          exit 1

      # ------------------------------------------------------------
      # ZAP Baseline Scan
      #
      # -J is resolved relative to /zap/wrk inside the container.
      # ------------------------------------------------------------
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          echo "============================================================"
          echo "STARTING ZAP BASELINE SCAN"
          echo "============================================================"

          docker run --rm \
            --user root \
            --network docker_security-testing \
            -v "$PWD/reports:/zap/wrk:rw" \
            zaproxy/zap-stable:2.16.0 \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -J zap-report.json \
              -I

          echo
          echo "============================================================"
          echo "REPORTS AFTER ZAP SCAN"
          echo "============================================================"

          ls -lah reports

      # ------------------------------------------------------------
      # Verify only JSON report (AI pipeline input)
      # ------------------------------------------------------------
      - name: Verify ZAP JSON Report
        run: |
          echo "Checking generated reports..."
          ls -la reports

          if [ ! -s reports/zap-report.json ]; then
            echo "Missing or empty reports/zap-report.json"
            exit 1
          fi

          echo "ZAP JSON report exists."
          python - <<'EOF'
          import json

          with open("reports/zap-report.json", encoding="utf-8") as report:
              data = json.load(report)

          sites = data.get("site", []) if isinstance(data, dict) else []
          if isinstance(sites, dict):
              sites = [sites]

          alerts = sum(len(site.get("alerts", [])) for site in sites)
          instances = sum(
              len(alert.get("instances", []))
              for site in sites
              for alert in site.get("alerts", [])
          )

          print(f"ZAP {data.get('@version', '?')} report: "
                f"{len(sites)} site(s), {alerts} alert type(s), "
                f"{instances} instance(s)")
          EOF

      # ------------------------------------------------------------
      # API Security Tests
      # ------------------------------------------------------------
      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests \
            -v \
            --html=reports/api-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # UI Security Tests
      # ------------------------------------------------------------
      - name: Run UI security tests
        continue-on-error: true
        run: |
          pytest ui_tests \
            -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # AI Pipeline Tests (must pass)
      # ------------------------------------------------------------
      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      # ------------------------------------------------------------
      # Upload Reports
      # ------------------------------------------------------------
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      # ------------------------------------------------------------
      # Collect and upload Docker logs if CI fails
      # ------------------------------------------------------------
      - name: Collect Docker logs
        if: failure()
        run: |
          mkdir -p reports/docker-logs

          docker compose -f docker/docker-compose.yml ps \
            > reports/docker-logs/compose-ps.txt 2>&1 || true

          docker compose -f docker/docker-compose.yml logs --no-color juice-shop \
            > reports/docker-logs/juice-shop.log 2>&1 || true

          docker compose -f docker/docker-compose.yml logs --no-color zap \
            > reports/docker-logs/zap.log 2>&1 || true

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: reports/docker-logs
          if-no-files-found: warn
