name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Run Security Automation Framework
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # ---------------------------------------------------------
      # Start target application and ZAP
      # ---------------------------------------------------------

      - name: Start Juice Shop and ZAP
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            up -d juice-shop zap

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:31001 > /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
          done

          echo "Juice Shop failed to start."

          docker compose \
            -f docker/docker-compose.yml \
            logs juice-shop

          exit 1

      - name: Wait for ZAP
        run: |
          for i in {1..60}; do
            if curl -fs \
              "http://localhost:31002/JSON/core/view/version/?apikey=secure-test-ops" \
              > /dev/null; then
              echo "ZAP is ready."
              exit 0
            fi

            echo "Waiting for ZAP..."
            sleep 5
          done

          echo "ZAP failed to start."

          docker compose \
            -f docker/docker-compose.yml \
            logs zap

          exit 1

      # ---------------------------------------------------------
      # OWASP ZAP security scan
      # ---------------------------------------------------------

      - name: Run ZAP security scan
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            run --rm secure-test-ops

      - name: Verify ZAP Report
        run: |
          echo "Checking for ZAP JSON report..."

          if [ ! -f reports/zap-report.json ]; then
            echo "ZAP report was not generated."

            echo "Reports directory:"
            ls -la reports

            echo "Searching workspace for any JSON reports:"
            find . -name "*.json" -type f -print

            echo "ZAP container logs:"
            docker compose \
              -f docker/docker-compose.yml \
              logs zap || true

            exit 1
          fi

          echo "ZAP report generated successfully:"
          ls -lh reports/zap-report.json

      # ---------------------------------------------------------
      # API security tests
      # Findings against intentionally vulnerable Juice Shop
      # are non-blocking and are collected as security findings.
      # ---------------------------------------------------------

      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests -v \
            --html=reports/api-report.html \
            --self-contained-html

      # ---------------------------------------------------------
      # UI security tests
      # Findings against intentionally vulnerable Juice Shop
      # are non-blocking and are collected as security findings.
      # ---------------------------------------------------------

      - name: Run UI security tests
        continue-on-error: true
        run: |
          pytest ui_tests -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ---------------------------------------------------------
      # AI-aware security pipeline
      # Requires:
      #   - reports/zap-report.json
      #   - reports/api-security-findings.json
      #   - reports/ui-security-findings.json
      # ---------------------------------------------------------

      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      # ---------------------------------------------------------
      # Upload reports
      # ---------------------------------------------------------

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: |
            reports/report.html
            reports/api-report.html
            reports/ui-report.html
          if-no-files-found: warn

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/*.json
            reports/*.md
          if-no-files-found: warn

      # ---------------------------------------------------------
      # Docker diagnostics
      # ---------------------------------------------------------

      - name: Show Docker status
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            ps

      - name: Upload Docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            reports/
          if-no-files-found: warn

      - name: Stop Docker services
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            down