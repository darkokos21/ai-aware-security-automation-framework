name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Run Security Automation Framework
    runs-on: ubuntu-latest

    timeout-minutes: 35

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python setup
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # Playwright browser
      # ------------------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # ------------------------------------------------------------
      # Start Juice Shop
      # ------------------------------------------------------------
      - name: Start Juice Shop
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            up -d juice-shop

      - name: Wait for Juice Shop
        run: |
          timeout_seconds=120
          interval_seconds=5
          elapsed=0

          while [ "$elapsed" -lt "$timeout_seconds" ]; do
            if curl -fsS http://127.0.0.1:31001 > /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi

            echo "Waiting for Juice Shop... ${elapsed}/${timeout_seconds}s"
            sleep "$interval_seconds"
            elapsed=$((elapsed + interval_seconds))
          done

          echo "Juice Shop failed to start."

          docker compose \
            -f docker/docker-compose.yml \
            logs juice-shop

          exit 1

      # ------------------------------------------------------------
      # OWASP ZAP Baseline Scan
      # ------------------------------------------------------------
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          mkdir -p reports

          docker run --rm \
            --network docker_security-testing \
            -v "$(pwd)/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -J zap-report.json \
              -r zap-report.html \
              -I || true

          echo "Contents of reports directory after ZAP scan:"
          ls -la reports

      # ------------------------------------------------------------
      # Verify ZAP reports exist
      # ------------------------------------------------------------
      - name: Verify ZAP Reports
        run: |
          echo "Checking generated ZAP reports..."

          ls -la reports

          if [ ! -f reports/zap-report.json ]; then
            echo "❌ ZAP JSON report is missing."
            exit 1
          fi

          if [ ! -f reports/zap-report.html ]; then
            echo "❌ ZAP HTML report is missing."
            exit 1
          fi

          echo "✅ ZAP reports generated successfully:"
          ls -lh reports/zap-report.*

      # ------------------------------------------------------------
      # API security tests
      # ------------------------------------------------------------
      - name: Run API Security Tests
        continue-on-error: true
        run: |
          pytest api_tests -v \
            --html=reports/api-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # UI security tests
      # ------------------------------------------------------------
      - name: Run UI Security Tests
        continue-on-error: true
        run: |
          pytest ui_tests -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # AI correlation / reporting pipeline
      # ------------------------------------------------------------
      - name: Run AI Pipeline Tests
        run: |
          pytest tests -v

      # ------------------------------------------------------------
      # Upload reports
      # ------------------------------------------------------------
      - name: Upload HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-reports
          path: |
            reports/report.html
            reports/api-report.html
            reports/ui-report.html
            reports/zap-report.html
          if-no-files-found: warn

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/*.json
            reports/*.md
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Docker logs if CI fails
      # ------------------------------------------------------------
      - name: Save Docker Logs on Failure
        if: failure()
        run: |
          mkdir -p reports/docker-logs

          docker compose \
            -f docker/docker-compose.yml \
            logs juice-shop > reports/docker-logs/juice-shop.log || true

      - name: Upload Docker Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: reports/docker-logs
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------
      - name: Stop Containers
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            down -v