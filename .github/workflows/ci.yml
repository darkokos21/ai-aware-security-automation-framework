name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Run Security Automation Framework
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Start Juice Shop
        run: |
          docker compose -f docker/docker-compose.yml up -d juice-shop

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:31001 > /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
          done

          echo "Juice Shop failed to start."

          docker compose \
            -f docker/docker-compose.yml \
            logs juice-shop

          exit 1

      - name: Run API security tests
        run: |
          pytest api_tests -v || true

      - name: Run UI security tests
        run: |
          pytest ui_tests -v || true

      - name: Run ZAP security scan
        run: |
          mkdir -p reports

          docker compose \
            -f docker/docker-compose.yml \
            --profile runner \
            run --rm secure-test-ops \
            python -m zap.run_scan

      - name: Verify ZAP report
        run: |
          echo "Checking for ZAP JSON report..."

          if [ ! -f reports/zap-report.json ]; then
            echo "ZAP report was not generated."

            echo "Reports directory:"
            ls -la reports

            echo "Searching workspace for any JSON reports:"
            find . -name "*.json" -type f -print

            exit 1
          fi

          echo "ZAP report generated successfully:"
          ls -lh reports/zap-report.json

      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/report.html
          if-no-files-found: warn

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/*.json
            reports/*.md
            reports/*.html
          if-no-files-found: warn

      - name: Upload Docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            docker/docker-compose.yml