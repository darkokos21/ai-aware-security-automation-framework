name: AI-Aware Security Automation Framework CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  security-framework:
    name: Security Automation Pipeline
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # Playwright
      # ------------------------------------------------------------
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # ------------------------------------------------------------
      # Prepare reports directory
      # ------------------------------------------------------------
      - name: Prepare reports directory
        run: |
          mkdir -p reports
          chmod -R 777 reports

      # ------------------------------------------------------------
      # Start Juice Shop + ZAP
      # ------------------------------------------------------------
      - name: Start Docker services
        run: |
          docker compose -f docker/docker-compose.yml up -d juice-shop zap

      # ------------------------------------------------------------
      # Wait for Juice Shop
      # ------------------------------------------------------------
      - name: Wait for Juice Shop
        run: |
          timeout=120
          elapsed=0

          until curl -fs http://localhost:31001 > /dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Juice Shop failed to start."
              docker compose -f docker/docker-compose.yml logs juice-shop
              exit 1
            fi

            sleep 5
            elapsed=$((elapsed+5))
          done

          echo "Juice Shop is ready."

      # ------------------------------------------------------------
      # Wait for ZAP API
      #
      # IMPORTANT:
      # Do NOT use the published host port 31002 here.
      #
      # The logs showed that:
      #   - ZAP is healthy
      #   - ZAP listens on 8080
      #   - the API works from inside the container
      #   - host -> 31002 is the failing path
      #
      # Therefore readiness is checked directly inside the ZAP
      # container.
      # ------------------------------------------------------------
      - name: Wait for ZAP API
        run: |
          timeout=60
          interval=5
          elapsed=0

          while [ "$elapsed" -lt "$timeout" ]; do
            echo "Checking ZAP API from inside container... ${elapsed}/${timeout}s"

            response="$(
              docker exec secure-test-ops-zap \
                sh -c 'wget -qO- "http://127.0.0.1:8080/JSON/core/view/version/?apikey=secure-test-ops"' \
                2>/dev/null \
                || true
            )"

            if printf '%s\n' "$response" \
              | python -m json.tool > /dev/null 2>&1 \
              && printf '%s\n' "$response" \
              | grep -q '"version"'; then

              echo "ZAP API is ready."
              echo "ZAP API response:"
              printf '%s\n' "$response"
              exit 0
            fi

            echo "ZAP API is not ready yet."

            if [ $((elapsed % 15)) -eq 0 ]; then
              echo "ZAP container status:"
              docker compose \
                -f docker/docker-compose.yml \
                ps zap

              echo "Recent ZAP logs:"
              docker compose \
                -f docker/docker-compose.yml \
                logs --tail=30 --no-color zap
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          echo "ZAP failed to become ready within ${timeout}s."

          echo "============================================================"
          echo "FINAL ZAP STATUS"
          echo "============================================================"

          docker compose \
            -f docker/docker-compose.yml \
            ps zap

          echo "============================================================"
          echo "FINAL ZAP INSPECT"
          echo "============================================================"

          docker inspect secure-test-ops-zap \
            --format='Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'

          echo "============================================================"
          echo "FINAL ZAP API CHECK FROM INSIDE CONTAINER"
          echo "============================================================"

          docker exec secure-test-ops-zap \
            sh -c 'wget -qO- "http://127.0.0.1:8080/JSON/core/view/version/?apikey=secure-test-ops" || true'

          echo

          echo "============================================================"
          echo "FINAL ZAP LOGS"
          echo "============================================================"

          docker compose \
            -f docker/docker-compose.yml \
            logs --tail=300 --no-color zap

          exit 1

      # ------------------------------------------------------------
      # ZAP Baseline Scan
      # ------------------------------------------------------------
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm \
            --user root \
            --network docker_security-testing \
            -v "$PWD/reports:/zap/wrk:rw" \
            zaproxy/zap-stable:2.16.0 \
            zap-baseline.py \
              -t http://juice-shop:3000 \
              -J /zap/wrk/zap-report.json \
              -I

          echo "Reports after scan:"
          ls -la reports

      # ------------------------------------------------------------
      # Verify ZAP JSON Report
      # ------------------------------------------------------------
      - name: Verify ZAP JSON Report
        run: |
          echo "Checking generated reports..."
          ls -la reports

          if [ ! -s reports/zap-report.json ]; then
            echo "Missing or empty reports/zap-report.json"
            exit 1
          fi

          echo "ZAP JSON report exists."
          head reports/zap-report.json

      # ------------------------------------------------------------
      # API Security Tests
      # ------------------------------------------------------------
      - name: Run API security tests
        continue-on-error: true
        run: |
          pytest api_tests \
            -v \
            --html=reports/api-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # UI Security Tests
      # ------------------------------------------------------------
      - name: Run UI security tests
        continue-on-error: true
        run: |
          pytest ui_tests \
            -v \
            --html=reports/ui-report.html \
            --self-contained-html

      # ------------------------------------------------------------
      # AI Pipeline Tests (must pass)
      # ------------------------------------------------------------
      - name: Run AI pipeline tests
        run: |
          pytest tests -v

      # ------------------------------------------------------------
      # Upload Reports
      # ------------------------------------------------------------
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      # ------------------------------------------------------------
      # Upload Docker logs if CI fails
      # ------------------------------------------------------------
      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            reports/
