[pytest]
testpaths =
    api_tests
    ui_tests
    tests

pythonpath =
    .

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    -p framework.security_pytest_plugin

markers =
    api: API tests
    ui: UI tests
    security: security tests
    smoke: smoke tests